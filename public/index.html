<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel</title><style>:root{color-scheme:dark;--bg:#09101e;--panel:#111c31;--line:#283957;--text:#edf3ff;--muted:#93a4c2;--accent:#39c8ff;--danger:#ff6376}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:24px 14px;background:#0b1425;border-right:1px solid var(--line)}.brand{font-size:19px;font-weight:800;margin:0 12px 34px}.brand b{color:var(--accent)}nav a{display:block;padding:10px 12px;color:var(--muted);text-decoration:none;border-radius:7px}nav a:hover,nav a.active{background:#1b2b47;color:white}.main{padding:30px;max-width:1440px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{font-size:26px;margin:0}.sub{color:var(--muted)}button,input{font:inherit}button{background:#168dbb;color:#fff;border:0;border-radius:7px;padding:9px 13px;cursor:pointer}button.secondary{background:#1a2943}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;margin-top:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar input{background:#0d1729;border:1px solid var(--line);border-radius:7px;padding:9px 11px;color:var(--text);min-width:260px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:13px;border-top:1px solid var(--line)}th{color:var(--muted);font-size:12px}.status{padding:4px 8px;border-radius:999px;background:#203451;color:#b7d9ff;font-size:12px}.error{color:#ff9ba7}.hidden{display:none}@media(max-width:720px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.toolbar{display:block}.toolbar input{width:100%;margin-bottom:10px}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><b>◆</b> SENTINEL</div><nav><a class="active" href="/">Servers</a><a href="#approvals">Approvals</a><a href="#audit">Audit log</a><a href="#notifications">Notifications</a></nav></aside><main class="main"><header class="top"><div><h1>Servers</h1><p class="sub">Only servers authorized by the backend are shown.</p></div><button id="logout" class="secondary">Sign out</button></header><section class="card"><div class="toolbar"><input id="search" aria-label="Search authorized servers" placeholder="Search name or identifier"><button id="refresh">Refresh</button></div><p id="notice" class="sub">Loading authorized servers…</p><table id="table" class="hidden"><thead><tr><th>SERVER</th><th>IDENTIFIER</th><th>NODE</th><th>STATUS</th><th></th></tr></thead><tbody></tbody></table></section></main></div><script type="module">const $=s=>document.querySelector(s),notice=$('#notice'),table=$('#table'),body=$('tbody');let servers=[];function text(v){return String(v??'—')}function render(){const q=$('#search').value.toLowerCase();body.replaceChildren(...servers.filter(s=>(s.attributes.name+' '+s.attributes.identifier).toLowerCase().includes(q)).map(s=>{const a=s.attributes,row=document.createElement('tr');for(const value of [a.name,a.identifier,a.relationships?.node?.attributes?.name||'—']){const cell=document.createElement('td');cell.textContent=text(value);row.append(cell)}const status=document.createElement('td'),pill=document.createElement('span');pill.className='status';pill.textContent=a.status||'configured';status.append(pill);row.append(status);const action=document.createElement('td'),button=document.createElement('button');button.className='secondary';button.textContent='Open';button.onclick=()=>location.assign('/?server='+encodeURIComponent(a.identifier));action.append(button);row.append(action);return row}));notice.textContent=servers.length?'':'No authorized servers found.';table.classList.toggle('hidden',!servers.length)}async function load(){notice.textContent='Loading authorized servers…';table.classList.add('hidden');try{const r=await fetch('/api/servers',{credentials:'same-origin'});if(r.status===401){location.assign('/login');return}const json=await r.json();if(!r.ok)throw Error(json.error?.message||'Unable to load servers');servers=json.data.data||[];table.classList.remove('hidden');render()}catch(e){notice.className='error';notice.textContent=e.message}}$('#refresh').onclick=load;$('#search').oninput=render;$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{'x-csrf-token':sessionStorage.csrf||''}});location.assign('/login')};load();</script></body></html>
